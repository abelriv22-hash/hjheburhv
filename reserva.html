<div class="main-container animated"><section id="reserva">
            <h2>Cotizar / Solicitar Unidad Privada</h2>
            <form class="contact-form" action="https://formsubmit.co/abelriv22@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="Nueva solicitud de cotización - VLAW MOBILITY">
                <input type="hidden" name="_captcha" value="false">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Morales" maxlength="30" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]{1,30}" oninput="this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü ]/g, '').slice(0, 30)" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono / WhatsApp:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="50370000000" inputmode="numeric" autocomplete="tel" maxlength="20" pattern="[0-9]{1,20}" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 20)" required>
                </div>
                <div class="form-group">
                    <label for="origen">Punto de Recogida (Origen):</label>
                    <input type="text" id="origen" name="origen" placeholder="Ej. Hotel Real Intercontinental" required>
                </div>
                <div class="form-group">
                    <label for="destino">Destino Final:</label>
                    <input type="text" id="destino" name="destino" placeholder="Ej. Aeropuerto Internacional" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría de Vehículo:</label>
                    <select id="categoria" name="categoria">
                        <option value="eco">VLAW Eco ($15.00 USD - Nissan Versa / Similar)</option>
                        <option value="green">VLAW Green ($17.50 USD - Toyota Prius Híbrido)</option>
                        <option value="comfort">VLAW Comfort ($18.00 USD - Hyundai Elantra)</option>
                        <option value="select">VLAW Select ($20.00 USD - Honda Civic)</option>
                        <option value="xl">VLAW XL ($22.00 USD - SUV Toyota RAV4)</option>
                        <option value="executive">VLAW Executive ($25.00 USD - BMW Serie 3)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha y Hora requerida:</label>
                    <input type="datetime-local" id="fecha" name="fecha" required>
                </div>
                <div class="form-group full-width">
                    <label for="notas">Notas Adicionales / N° de Vuelo / Equipaje:</label>
                    <textarea id="notas" name="notas" rows="3" placeholder="Indica si requieres silla para bebé, maletas extra o notas específicas..."></textarea>
                </div>
                <button type="submit" class="btn-submit" style="grid-column: 1 / -1;">Confirmar y Solicitar Auto</button>
            </form>
        </section></div><footer><p>&copy; 2026 VLAW MOBILITY & Executive Transports. Todos los derechos reservados.</p></footer><script src="script.js"></script></body></html>
